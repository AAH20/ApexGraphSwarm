[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "apexgraphswarm"
version = "0.1.0"
description = "ApexGraphSwarm control plane: graph orchestration, analytics, and agent management"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ApexGraphSwarm"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["apexgraphswarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
