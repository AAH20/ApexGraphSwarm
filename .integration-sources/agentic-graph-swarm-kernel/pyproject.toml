[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-graph-swarm-kernel"
version = "1.0.0"
description = "Deterministic NP-hard Graph Engineering and Swarm Orchestration Kernel for Autonomous Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ahmed Hassan", email = "ahmed.a.hassan@outlook.com"}
]
keywords = [
    "multi-agent-systems",
    "graph-engineering",
    "swarm-intelligence",
    "np-hard-optimization",
    "hypergraph-coalition",
    "causal-dag",
    "epistemic-consensus",
    "byzantine-resilience",
    "submodular-routing",
    "spectral-graph-theory",
    "game-theoretic-nash",
    "pareto-optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Distributed Computing"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AAH20/agentic-graph-swarm-kernel"
Repository = "https://github.com/AAH20/agentic-graph-swarm-kernel"
Issues = "https://github.com/AAH20/agentic-graph-swarm-kernel/issues"

[project.scripts]
agentic-swarm = "agentic_graph_swarm_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_graph_swarm_kernel*"]
