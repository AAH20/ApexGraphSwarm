apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apexgraphswarm-data
  namespace: apexgraphswarm
  labels:
    app.kubernetes.io/name: apexgraphswarm
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
