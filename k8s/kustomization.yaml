apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apexgraphswarm

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 03-pvc.yaml
  - 04-deployment.yaml
  - 05-service.yaml
  - 06-ingress.yaml
  - 07-hpa.yaml
  - 08-pdb.yaml
  - 09-networkpolicy.yaml
  - 10-serviceaccount.yaml

commonLabels:
  app.kubernetes.io/name: apexgraphswarm
  app.kubernetes.io/managed-by: kustomize

images:
  - name: apexgraphswarm/web
    newTag: latest

configMapGenerator:
  - name: apexgraphswarm-config
    behavior: merge
    literals:
      - NODE_ENV=production
