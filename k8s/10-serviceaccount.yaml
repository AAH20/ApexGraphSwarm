apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexgraphswarm
  namespace: apexgraphswarm
  labels:
    app.kubernetes.io/name: apexgraphswarm
    app.kubernetes.io/component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apexgraphswarm
  namespace: apexgraphswarm
  labels:
    app.kubernetes.io/name: apexgraphswarm
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apexgraphswarm
  namespace: apexgraphswarm
  labels:
    app.kubernetes.io/name: apexgraphswarm
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: apexgraphswarm
    namespace: apexgraphswarm
roleRef:
  kind: Role
  name: apexgraphswarm
  apiGroup: rbac.authorization.k8s.io
