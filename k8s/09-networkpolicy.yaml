apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apexgraphswarm-web
  namespace: apexgraphswarm
  labels:
    app.kubernetes.io/name: apexgraphswarm
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apexgraphswarm
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3010
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apexgraphswarm
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
