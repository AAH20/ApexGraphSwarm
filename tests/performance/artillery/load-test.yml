# Artillery Load Test - Gradual ramp to 10K RPS
# Validates system behavior under expected production load

config:
  target: "{{ $processEnvironment.BASE_URL || 'http://127.0.0.1:3010' }}"
  phases:
    - name: "Warm up"
      duration: 30
      arrivalRate: 100
    - name: "Ramp to target"
      duration: 60
      arrivalRate: 1000
      rampTo: 10000
    - name: "Sustained load"
      duration: 300
      arrivalRate: 10000
    - name: "Ramp down"
      duration: 30
      arrivalRate: 10000
      rampTo: 0
  defaults:
    headers:
      Content-Type: "application/json"
  processor: "./artillery-helpers.js"

scenarios:
  - name: "Read-heavy mix"
    weight: 70
    flow:
      - get:
          url: "/api/integrations"
          expect:
            - statusCode: 200
      - think: 0.1
      - get:
          url: "/api/decisions"
          expect:
            - statusCode: 200
      - think: 0.1
      - get:
          url: "/api/ecosystem/mcp"
          expect:
            - statusCode: 200

  - name: "Status checks"
    weight: 20
    flow:
      - get:
          url: "/api/review"
          expect:
            - statusCode: 200
      - think: 0.1
      - get:
          url: "/api/graph-store"
          expect:
            - statusCode: 200

  - name: "Control operations"
    weight: 10
    flow:
      - post:
          url: "/api/control"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            action: "status"
            runId: "artillery-load-test"
          expect:
            - statusCode: 200
