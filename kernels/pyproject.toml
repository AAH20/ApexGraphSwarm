[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "apexgraphswarm-kernels"
version = "0.1.0"
description = "ApexGraphSwarm solver kernels: consensus, scheduling, optimization, security"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ApexGraphSwarm"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
