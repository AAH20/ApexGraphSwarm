# Alertmanager configuration for ApexGraphSwarm
global:
  smtp_smarthost: localhost:587
  smtp_from: alerts@apexgraphswarm.local
  # slack_api_url: '${SLACK_WEBHOOK_URL}'  # Set via environment variable

route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h
    - match:
        team: finance
      receiver: finance
      repeat_interval: 2h

receivers:
  - name: default
    # email_configs:
    #   - to: team@apexgraphswarm.local
    # slack_configs:
    #   - channel: '#apexgraphswarm-alerts'
    #     send_resolved: true

  - name: critical
    # email_configs:
    #   - to: oncall@apexgraphswarm.local
    # slack_configs:
    #   - channel: '#apexgraphswarm-critical'
    #     send_resolved: true

  - name: finance
    # email_configs:
    #   - to: finance@apexgraphswarm.local

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
