name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ── Python lint & syntax ──────────────────────────────────────────
  python-lint:
    name: Python Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Syntax check all Python files
        run: |
          python -m compileall -q apexgraphswarm/ scripts/ tests/
          echo "✅ All Python files compile successfully"

      - name: Check for common issues
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '.integration-sources' in str(f) or 'node_modules' in str(f):
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'❌ {e}', file=sys.stderr)
              sys.exit(1)
          print('✅ AST parse check passed')
          "

  # ── Python tests ──────────────────────────────────────────────────
  python-test:
    name: Python Tests (${{ matrix.os }}, Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: |
          export PYTHONPATH="${{ github.workspace }}:${PYTHONPATH:-}"
          python -m unittest discover -s tests -v 2>&1
        timeout-minutes: 15

  # ── Web lint & typecheck ──────────────────────────────────────────
  web-lint:
    name: Web Lint & Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  # ── Web tests ─────────────────────────────────────────────────────
  web-test:
    name: Web Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm test
        timeout-minutes: 15

  # ── Web build ─────────────────────────────────────────────────────
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: apps/web/.next/
          retention-days: 7

  # ── Security scan ─────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Python security scan
        run: |
          echo "Scanning Python files for security issues..."
          python -c "
          import ast, sys, pathlib, re

          issues = []
          dangerous_patterns = [
              (r'eval\s*\(', 'Use of eval()'),
              (r'exec\s*\(', 'Use of exec()'),
              (r'subprocess\.\s*call\s*\([^)]*shell\s*=\s*True', 'shell=True in subprocess'),
              (r'os\.system\s*\(', 'Use of os.system()'),
              (r'pickle\.loads?\s*\(', 'Use of pickle'),
              (r'yaml\.load\s*\([^)]*\)', 'Unsafe yaml.load'),
          ]

          for f in pathlib.Path('.').rglob('*.py'):
              if '.integration-sources' in str(f) or 'node_modules' in str(f):
                  continue
              content = f.read_text()
              for pattern, desc in dangerous_patterns:
                  if re.search(pattern, content):
                      issues.append(f'{f}: {desc}')

          if issues:
              for i in issues:
                  print(f'⚠️  {i}')
          else:
              print('✅ No obvious security issues found in Python code')
          "

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: security-report.json
          retention-days: 30
        if: always()

  # ── Summary ────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, web-lint, web-test, web-build, security]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint | ${{ needs.python-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Lint & Typecheck | ${{ needs.web-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Tests | ${{ needs.web-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ${{ needs.web-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
