name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ── Python lint & syntax ──────────────────────────────────────────
  python-lint:
    name: Python Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Syntax check all Python files
        run: |
          python -m compileall -q apexgraphswarm/ scripts/ tests/
          echo "All Python files compile successfully"

      - name: AST parse check
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '.integration-sources' in str(f) or 'node_modules' in str(f) or '.venv' in str(f):
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL {e}', file=sys.stderr)
              sys.exit(1)
          print('AST parse check passed')
          "

  # ── Python tests ──────────────────────────────────────────────────
  python-test:
    name: Python Tests (${{ matrix.os }}, Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The integration tests import four sibling kernel repositories. They are
      # separate repos, checked out here rather than vendored, so this repo holds
      # no copy of their source.
      - name: Check out integration kernel sources
        shell: bash
        run: ./scripts/fetch-integration-sources.sh

      - name: Install dependencies
        run: python -m pip install --quiet pytest networkx numpy hypothesis

      - name: Run test suite
        run: python -m pytest -q
        timeout-minutes: 15

  # ── Web lint & typecheck ──────────────────────────────────────────
  # apps/web depends on the workspace package @apexgraphswarm/governance via
  # `workspace:*`, which only resolves when npm installs from the monorepo root.
  web-lint:
    name: Web Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Configure git for the runner
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: Typecheck governance package
        run: npm run typecheck --workspace @apexgraphswarm/governance

      - name: TypeScript typecheck
        run: npm run typecheck --workspace apexgraphswarm-workbench

  # ── Web tests ─────────────────────────────────────────────────────
  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      # The optimization route shells out to git. On a CI runner the workspace can
      # trip git's dubious-ownership guard, and git needs an identity to run at all;
      # without both, inspection exits 128 and the route answers 400.
      - name: Configure git for the runner
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: Governance package tests
        run: npm test --workspace @apexgraphswarm/governance
        timeout-minutes: 10

      - name: Web tests
        run: npm test --workspace apexgraphswarm-workbench
        timeout-minutes: 15

  # ── Web build ─────────────────────────────────────────────────────
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build --workspace apexgraphswarm-workbench

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: apps/web/.next/
          retention-days: 7

  # ── Security scan ─────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python security scan
        run: |
          python -c "
          import pathlib, re, json

          issues = []
          dangerous_patterns = [
              (r'eval\s*\(', 'Use of eval()'),
              (r'exec\s*\(', 'Use of exec()'),
              (r'subprocess\.\s*call\s*\([^)]*shell\s*=\s*True', 'shell=True in subprocess'),
              (r'os\.system\s*\(', 'Use of os.system()'),
              (r'pickle\.loads?\s*\(', 'Use of pickle'),
              (r'yaml\.load\s*\([^)]*\)', 'Unsafe yaml.load'),
          ]

          for f in pathlib.Path('.').rglob('*.py'):
              if '.integration-sources' in str(f) or 'node_modules' in str(f) or '.venv' in str(f):
                  continue
              content = f.read_text()
              for pattern, desc in dangerous_patterns:
                  if re.search(pattern, content):
                      issues.append(f'{f}: {desc}')

          pathlib.Path('security-report.json').write_text(
              json.dumps({'findings': issues, 'count': len(issues)}, indent=2))
          for i in issues:
              print(f'WARN {i}')
          print(f'Python scan complete: {len(issues)} finding(s)')
          "

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: npm audit
        run: npm audit --audit-level=high --workspaces --include-workspace-root
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: security-report.json
          retention-days: 30
        if: always()

  # ── Summary ────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, web-lint, web-test, web-build, security]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint | ${{ needs.python-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Lint & Typecheck | ${{ needs.web-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Tests | ${{ needs.web-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ${{ needs.web-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
